name: Fork Build

# 跨仓库构建：本仓库不包含 TauriTavern 源码，运行时从 inputs 指定的
# 仓库与 ref 实时拉取代码构建。产物发布到滚动 prerelease（tag: ci-builds）。
# 桌面包无代码签名（Windows SmartScreen / macOS Gatekeeper 需手动放行）；
# Android 使用 Gradle 自动生成的 debug keystore 签名。

run-name: Build ${{ inputs.source_repo }}@${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "要构建的仓库（owner/repo），可填自己的 fork 或上游 Darkatse/TauriTavern"
        required: true
        default: lovewormcn/TauriTavern
        type: string
      source_ref:
        description: "要构建的分支名、tag 或 commit SHA"
        required: true
        default: dev
        type: string

permissions:
  contents: read

concurrency:
  group: fork-build-${{ inputs.source_repo }}-${{ inputs.source_ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ci-builds

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      sha12: ${{ steps.meta.outputs.sha12 }}
      repo_slug: ${{ steps.meta.outputs.repo_slug }}
      ref_slug: ${{ steps.meta.outputs.ref_slug }}
      build_time: ${{ steps.meta.outputs.build_time }}
      app_version: ${{ steps.meta.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}

      - name: Resolve build metadata
        id: meta
        shell: bash
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          repo_slug=$(printf '%s' "$SOURCE_REPO" | tr -c 'a-zA-Z0-9.' '-')
          ref_slug=$(printf '%s' "$SOURCE_REF" | tr -c 'a-zA-Z0-9.' '-' | cut -c1-60)
          build_time=$(date -u +'%Y%m%d-%H%M')
          app_version=$(node -p "require('./src-tauri/crates/tauritavern/tauri.conf.json').version")
          {
            echo "sha=$sha"
            echo "sha12=${sha:0:12}"
            echo "repo_slug=$repo_slug"
            echo "ref_slug=$ref_slug"
            echo "build_time=$build_time"
            echo "app_version=$app_version"
          } >> "$GITHUB_OUTPUT"

  desktop:
    needs: prepare
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            target_args: --bundles nsis
          - name: macos-x64
            platform: macos-latest
            target_args: --target x86_64-apple-darwin --bundles dmg
          - name: macos-arm64
            platform: macos-latest
            target_args: --target aarch64-apple-darwin --bundles dmg
          - name: linux-x64
            platform: ubuntu-22.04
            target_args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    env:
      TAURITAVERN_BUILD_BRANCH: ${{ inputs.source_repo }}@${{ inputs.source_ref }}
      TAURITAVERN_BUILD_REVISION: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf pkg-config \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-alsa gstreamer1.0-pulseaudio

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          args: ${{ matrix.target_args }}
          uploadWorkflowArtifacts: true
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          workflowArtifactNamePattern: 'TauriTavern-${{ needs.prepare.outputs.repo_slug }}-${{ needs.prepare.outputs.ref_slug }}-${{ needs.prepare.outputs.sha12 }}-[platform]-[arch]-[bundle]'

  android:
    needs: prepare
    timeout-minutes: 75
    runs-on: ubuntu-latest
    env:
      TAURITAVERN_BUILD_BRANCH: ${{ inputs.source_repo }}@${{ inputs.source_ref }}
      TAURITAVERN_BUILD_REVISION: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}

      - name: Install Android host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
          cache-dependency-path: |
            src-tauri/crates/tauritavern/gen/android/**/*.gradle*
            src-tauri/crates/tauritavern/gen/android/**/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true

      - name: Configure Android compiler
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          toolchain="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          sysroot="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          {
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android24-clang"
            echo "AR_armv7_linux_androideabi=$toolchain/llvm-ar"
            echo "CC_armv7_linux_androideabi=$toolchain/armv7a-linux-androideabi24-clang"
            echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$sysroot"
            echo "BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi=--sysroot=$sysroot"
          } >> "$GITHUB_ENV"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - name: Build debug APKs
        uses: tauri-apps/tauri-action@v1
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          projectPath: src-tauri/crates/tauritavern
          tauriScript: node ../../../scripts/tauri-app.mjs
          mobile: android
          args: --verbose --debug --apk --split-per-abi --target aarch64 armv7
          uploadWorkflowArtifacts: true
          uploadPlainBinary: false
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false
          workflowArtifactNamePattern: 'TauriTavern-${{ needs.prepare.outputs.repo_slug }}-${{ needs.prepare.outputs.ref_slug }}-${{ needs.prepare.outputs.sha12 }}-[platform]-[arch]-[bundle]'

  publish:
    needs: [prepare, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_REPO: ${{ inputs.source_repo }}
      SOURCE_REF: ${{ inputs.source_ref }}
      REPO_SLUG: ${{ needs.prepare.outputs.repo_slug }}
      REF_SLUG: ${{ needs.prepare.outputs.ref_slug }}
      SHA: ${{ needs.prepare.outputs.sha }}
      SHA12: ${{ needs.prepare.outputs.sha12 }}
      BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'TauriTavern-*'
          path: dist

      - name: Flatten bundles into release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          for dir in dist/*/; do
            name=$(basename "$dir")
            # tauri-action 会额外上传未打包的 .app 目录制品，跳过。
            [[ "$name" == *-app ]] && continue
            bundle=${name##*-}
            case "$bundle" in
              nsis) ext=exe ;;
              dmg) ext=dmg ;;
              appimage) ext=AppImage ;;
              deb) ext=deb ;;
              apk) ext=apk ;;
              *) echo "Skipping unsupported artifact: $name"; continue ;;
            esac
            file=$(find "$dir" -type f -print -quit)
            if [[ -z "$file" ]]; then
              echo "No file found in $name" >&2
              exit 1
            fi
            cp "$file" "release-assets/${name}.${ext}"
          done

          echo "Collected assets:"
          find release-assets -type f -printf '%f  (%k KB)\n' | sort

          # 1 Windows + 2 macOS + 2 Linux + 2 Android = 8 个制品。
          count=$(find release-assets -type f | wc -l | tr -d ' ')
          if [[ "$count" -ne 8 ]]; then
            echo "Expected 8 release assets, found $count" >&2
            exit 1
          fi

      - name: Ensure rolling prerelease exists
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --title "Fork CI Builds" \
              --notes "滚动测试构建。每次手动触发 workflow 后自动更新。"

      - name: Upload assets
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -print0 \
            | xargs -0 gh release upload "$RELEASE_TAG" --clobber

      - name: Remove superseded assets for the same ref
        shell: bash
        run: |
          set -euo pipefail
          prefix="TauriTavern-${REPO_SLUG}-${REF_SLUG}-"
          current=$(find release-assets -type f -printf '%f\n')
          while IFS=$'\t' read -r id name; do
            [[ "$name" == "$prefix"* ]] || continue
            grep -Fxq "$name" <<<"$current" && continue
            echo "Deleting superseded asset: $name"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done < <(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
              --jq '.assets[] | [.id, .name] | @tsv'
          )

      - name: Cap total asset count
        shell: bash
        run: |
          set -euo pipefail
          # 只保留最新的 120 个资产（约 15 次完整构建），更旧的删除。
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '.assets | sort_by(.created_at) | reverse | .[120:] | .[].id' \
          | while read -r asset_id; do
              echo "Deleting old asset $asset_id"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done

      - name: Update release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            printf '# Fork CI Builds（滚动测试构建）\n\n'
            printf '> 非官方测试包，无代码签名，仅供功能验证。\n'
            printf '> Windows 首次运行需在 SmartScreen 选择"更多信息 → 仍要运行"；\n'
            printf '> macOS 需右键打开，或执行 `xattr -dr com.apple.quarantine /Applications/TauriTavern.app`；\n'
            printf '> Android 为 debug 签名 APK。\n\n'
            printf '## 最新构建\n\n'
            printf -- '- 来源：`%s` @ `%s`\n' "$SOURCE_REPO" "$SOURCE_REF"
            printf -- '- Commit：[`%s`](https://github.com/%s/commit/%s)\n' "$SHA12" "$SOURCE_REPO" "$SHA"
            printf -- '- 应用版本：%s\n' "$APP_VERSION"
            printf -- '- 构建时间（UTC）：%s\n' "$BUILD_TIME"
            printf -- '- [触发本次构建的 workflow 运行](%s/%s/actions/runs/%s)\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '\n## 下载\n\n'
            printf '资产命名规则：`TauriTavern-<仓库>-<分支>-<commit>-<平台>-<架构>-<包类型>`。\n'
            printf '同一分支重新构建会替换同名资产；不同分支的资产各自保留，直到超过总数上限。\n'
          } > release-notes.md
          gh release edit "$RELEASE_TAG" \
            --prerelease \
            --title "Fork CI Builds · ${SOURCE_REF}@${SHA12}" \
            --notes-file release-notes.md
